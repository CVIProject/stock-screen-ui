<div *ngIf="loading" class="regime-loader-overlay">
  <div class="regime-loader">
    <div class="regime-spinner"></div>
    <p>Processing your regime file...</p>
    <small>Please wait, this may take a moment</small>
  </div>
</div>

<div *ngIf="errorMessage" class="regime-error-banner">
  <span>{{ errorMessage }}</span>
  <button type="button" aria-label="Close error" (click)="errorMessage = null">&times;</button>
</div>

<div class="regime-toast-container">
  <div *ngFor="let toast of toasts" class="regime-toast" [ngClass]="'regime-toast-' + toast.type">
    <span>{{ toast.message }}</span>
    <button type="button" aria-label="Close notification" (click)="removeToast(toast.id)">
      <i class="fas fa-times"></i>
    </button>
  </div>
</div>

<div class="regime-upload-wrapper" [class.disabled]="loading">
  <div class="regime-upload-card">
    <div class="regime-card-body">
      <div class="regime-icon">
        <i class="fas fa-file-excel"></i>
      </div>
      <h3>Quad based Analysis</h3>
      <p>Upload one Excel file to continue with regime analysis</p>

      <div class="regime-file-input-box">
        <input
          type="file"
          id="regimeFileInput"
          accept=".xlsx,.xls"
          (change)="onRegimeFileSelected($event)"
          [disabled]="loading"
        />
        <label for="regimeFileInput">
          <i class="fas fa-cloud-upload-alt"></i>
          <strong>Regime Excel</strong>
          <small>Excel files (.xlsx, .xls)</small>
        </label>
      </div>

      <div *ngIf="selectedRegimeFile" class="regime-selected-file">
        <i class="fas fa-check-circle"></i>
        <span>{{ selectedRegimeFile.name }}</span>
      </div>

      <button
        type="button"
        class="regime-continue-button"
        (click)="continueWithRegime()"
        [disabled]="loading || !selectedRegimeFile">
        <span *ngIf="!loading"><i class="fas fa-arrow-right"></i> Start Analysis</span>
        <span *ngIf="loading"><i class="fas fa-spinner fa-spin"></i> Processing...</span>
      </button>
    </div>
  </div>
</div>
